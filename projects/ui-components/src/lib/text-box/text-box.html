<div class="text-box-container">

  <div class="text-box-input-wrapper">

    <input
      class="text-box-input"

      [type]="inputType"

      [placeholder]="placeholder"

      [value]="value"

      [disabled]="disabled"

      [readonly]="readonly"

      (input)="onInput($event)"

      (click)="onClick($event)"
    />

    <!-- Password Eye Button -->
    @if (type === 'password') {

      <button
        type="button"
        class="text-box-password-button"

        [disabled]="disabled"

        (click)="togglePassword($event)"
        aria-label="Toggle password visibility"
      >

        @if (showPassword) {

          <!-- Eye Off -->
          <svg
            class="text-box-password-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3 3l18 18"
            />

            <path
              d="M10.6 10.6a2 2 0 1 0 2.8 2.8"
            />

            <path
              d="M9.9 4.2A10.8 10.8 0 0 1 12 4c5 0 8.7 4.2 9.8 8a10.8 10.8 0 0 1-3.1 5.1"
            />

            <path
              d="M6.2 6.2C4.5 7.4 3.2 9.2 2.2 12c1.1 3.8 4.8 8 9.8 8 1.7 0 3.3-.5 4.7-1.2"
            />
          </svg>

        } @else {

          <!-- Eye -->
          <svg
            class="text-box-password-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M2 12s3.5-7 10-7
                 10 7 10 7
                 -3.5 7-10 7
                 -10-7-10-7z"
            />

            <circle
              cx="12"
              cy="12"
              r="3"
            />
          </svg>

        }

      </button>

    }

  </div>

</div>
